# TP Mininet-WiFi -- étape 3 : un véhicule traverse deux cellules, chacune avec son Edge.
name: tp_mobility
duration_s: 60
tick_s: 0.1
phases: [{name: route, start: 0, end: 60}]
radio:
  handover_ms: 100
  ground: {ptx_dbm: 20, pl1m_db: 40, exponent: 3.0, noise_dbm: -90, snr_min_db: 5,
           bandwidth_mhz: 20, efficiency: 0.3, rate_max_mbps: 30}
  a2g: {env: urban, freq_ghz: 2.4, ptx_dbm: 0, noise_dbm: -90, snr_min_db: 5,
        bandwidth_mhz: 20, efficiency: 0.3, rate_max_mbps: 30}
sites: {S1: {}, S2: {}, CLOUD: {}}
wired:
  - {a: S1, b: S2, delay_ms: 25, bw_mbps: 100}   # lien inter-Edge « régional »
  - {a: S1, b: CLOUD, delay_ms: 20, bw_mbps: 100}
access_delay_ms: 8
aps:
  - {id: AP1, pos: [150, 20, 6], site: S1, capacity_mbps: 25, channel: 1}
  - {id: AP2, pos: [400, 20, 6], site: S2, capacity_mbps: 25, channel: 6}
edges:
  E1: {site: S1, workers: 1, service_ms: 20}
  E2: {site: S2, workers: 1, service_ms: 20}
cloud: {site: CLOUD, workers: 16, service_ms: 12}
vehicles:
  trace: scenarios/traces/single_600m.csv
  count: 1
  local_service_ms: 140
tasks: {rate_hz: 5, input_kb: 200, output_kb: 2, deadline_ms: 150, jitter_cv: 0.1}
perception: {enabled: false}
load_report_s: 0.5
uav: {enabled: false}
events: []
policies:
  offloading:  {cls: "policies.baselines:AlwaysEdge"}
  association: {cls: "policies.baselines:StrongestSNR", args: {hysteresis_db: 3}}
mininet: {ip_prefix: "10.0.0.", wifi_mode: g, update_positions: false, shaping_min_change: 0.15}
